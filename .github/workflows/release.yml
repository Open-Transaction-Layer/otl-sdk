name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    # Forks never publish, and this job holds no secrets, so the guards and the
    # full check run here before anything privileged starts.
    if: github.repository == 'Open-Transaction-Layer/otl-sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # A release can be published against any tag, so the tag is treated as
      # untrusted input and checked before anything is built. It must name a
      # plain version, the tagged commit must already be on main, every package
      # must carry exactly that version and no changeset may be pending, which
      # means the release pull request has been merged.
      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail 'The tag must look like v1.2.3'
          git merge-base --is-ancestor "$SHA" origin/main || fail 'The tagged commit is not on main'
          expected="${TAG#v}"
          for manifest in packages/*/package.json; do
            actual="$(node -p "require('./$manifest').version")"
            [ "$actual" = "$expected" ] || fail "$manifest is at $actual, not $expected"
          done
          for file in .changeset/*.md; do
            if [ -e "$file" ] && [ "$(basename "$file")" != "README.md" ]; then
              fail 'A changeset is still pending, so the release pull request has not been merged'
            fi
          done

      - run: npm ci --ignore-scripts
      - run: npm run check

  release:
    name: release
    needs: check
    runs-on: ubuntu-latest
    # npm trusts this job through OIDC, scoped to this repository, this
    # workflow file and this environment, so no npm token exists anywhere. The
    # environment requires a reviewer's approval before the job starts, so
    # publishing a release alone never publishes the packages.
    environment: release
    permissions:
      contents: read
      id-token: write      # mint the OIDC token npm authenticates and signs provenance with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Install scripts of dependencies never run in the job that can publish.
      - run: npm ci --ignore-scripts

      # Publishing authenticates with the OIDC token that npm's trusted
      # publisher configuration accepts, which needs npm 11.5.1 or later, so
      # the step below fails early on an older npm instead of falling back to
      # anything else.
      - name: Require an npm that supports trusted publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -n1)" != '11.5.1' ]; then
            echo "npm $version is older than 11.5.1 and cannot publish with trusted publishing" >&2
            exit 1
          fi

      # Every package version not yet on npm is published. Provenance comes from
      # the id-token permission above plus publishConfig.provenance in each
      # manifest, so a consumer can verify a tarball was built from this
      # repository rather than from someone's laptop. The release already
      # carries the tag, so nothing is pushed back.
      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run release
