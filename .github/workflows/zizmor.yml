name: Workflow security

on:
  push:
    branches: [main]
    paths: ['.github/**']
  # No path filter on pull requests: this check is required, and a required check
  # that does not run on a pull request leaves it waiting forever.
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # The requirements file pins zizmor and the hash of every release file, so
      # the install fails if any downloaded file differs from the reviewed one.
      - name: Install zizmor
        run: python -m pip install --require-hashes --no-deps --requirement .github/zizmor/requirements.txt
      # Static analysis of the workflows themselves, which catches template
      # injection, unpinned actions, over-broad permissions and credential
      # persistence before they can be merged. Findings print in the job log
      # and fail the check, so this needs no code-scanning upload.
      - name: Analyse workflows
        run: zizmor --format plain --min-severity low .github
