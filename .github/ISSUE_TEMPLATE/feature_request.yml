name: Feature request
description: Suggest a capability this project does not have yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. If you have found a security problem instead, please do not file it here and follow [SECURITY.md](https://github.com/Open-Transaction-Layer/otl-sdk/security/policy) to report it privately.
  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: Describe what you are trying to do and why the current behaviour stops you, because the problem is easier to weigh than a proposed solution on its own.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
      description: Describe the behaviour or API you have in mind, and any alternatives you considered.
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package this would affect
      placeholder: "@otl/credentials"
